[project]
name = "cuvis-ai-patchcore"
dynamic = ["version"]
description = "HSI-PatchCore for Cuvis.AI: nonparametric memory-bank anomaly detection on raw hyperspectral spectra"
requires-python = ">=3.11,<3.12"
authors = [
  { name = "Cubert GmbH", email = "cuvis.ai@cubert-gmbh.de" },
]
maintainers = [
  { name = "Cubert GmbH", email = "cuvis.ai@cubert-gmbh.de" },
]
license = { text = "Apache-2.0" }
readme = "README.md"

keywords = [
  "cuvis",
  "hyperspectral",
  "anomaly-detection",
  "patchcore",
  "memory-bank",
  "plugin",
  "cuvis-ai",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Operating System :: OS Independent",
]

dependencies = [
  # Plugins target cuvis-ai-core + cuvis-ai-schemas only (never the high-level cuvis-ai package).
  # core >= 0.15: class-level EXECUTION_STAGES, `name`-only base kwargs.
  "cuvis-ai-core>=0.15.0",
  "cuvis-ai-schemas>=0.10.0",
  "torch>=2.2",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov",
  "ruff",
  "mypy",
  "bandit",
  "detect-secrets",
  "pip-audit",
  "twine>=6.2.0",
  "pyyaml",
]

[project.urls]
Homepage   = "https://docs.cuvis.ai/latest/"
Repository = "https://github.com/cubert-hyperspectral/cuvis-ai-patchcore"
Issues     = "https://github.com/cubert-hyperspectral/cuvis-ai-patchcore/issues"
Changelog  = "https://github.com/cubert-hyperspectral/cuvis-ai-patchcore/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cuvis_ai_patchcore*"]

[tool.setuptools_scm]
# Version is derived from git tags (v0.1.0 -> 0.1.0); pre-tag builds get post-release dev versions.
version_scheme = "post-release"
local_scheme = "node-and-date"
fallback_version = "0.1.0"

# GPU plugin: torch from the cu128 index for local `uv sync`. CI runs `uv run --no-sources --locked`
# against a uv.lock generated with `uv lock --no-sources` (CPU torch from PyPI) — do not commit a
# locally re-resolved lock.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: small, fast tests that don't touch network or large data files.",
  "integration: full-stack tests (manifest loading via NodeRegistry, pipeline reload).",
  "slow: GPU / real-data tests, skipped in CI (run with -m slow).",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
extend-select = ["ANN201", "ANN202", "ANN204"]

[tool.ruff.lint.per-file-ignores]
# Tests: return-type annotations are readability noise, not defects.
"tests/**" = ["ANN201", "ANN202", "ANN204"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests", "examples", "build", "dist"]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101"]

[tool.coverage.run]
source = ["cuvis_ai_patchcore"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
